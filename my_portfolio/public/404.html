<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Nothing at this address | Beamlak Sintayehu</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#07080a" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #07080a;
      --panel: #0e1116;
      --hairline: rgba(237, 232, 223, 0.09);
      --bone: #ede8df;
      --muted: #8a8f96;
      --ember: #e9a268;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --sans: 'Space Grotesk', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--ink);
      background-image:
        radial-gradient(ellipse 70% 50% at 75% 0%, rgba(233, 162, 104, 0.10), transparent 60%),
        radial-gradient(ellipse 60% 45% at 10% 100%, rgba(159, 216, 228, 0.05), transparent 60%);
      color: var(--bone);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .grid-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(237, 232, 223, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(237, 232, 223, 0.02) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent 78%);
    }

    main {
      position: relative;
      width: min(560px, 100%);
      padding: clamp(2rem, 6vw, 3rem);
      border: 1px solid var(--hairline);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(237, 232, 223, 0.04), transparent 55%), var(--panel);
      box-shadow: 0 40px 120px -50px rgba(0, 0, 0, 0.95);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 1.5rem;
    }
    .eyebrow::before {
      content: '';
      width: 26px;
      height: 1px;
      background: currentColor;
      opacity: 0.6;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -0.04em;
      margin-bottom: 1rem;
    }

    h1 em {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      color: var(--ember);
    }

    p {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--muted);
      max-width: 42ch;
      margin-bottom: 2rem;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }

    a {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.72rem 1.35rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .primary {
      background: linear-gradient(135deg, #f4c79b 0%, #e9a268 50%, #c9793f 100%);
      color: #1a1108;
      box-shadow: 0 12px 32px -14px rgba(233, 162, 104, 0.6);
    }
    .primary:hover { transform: translateY(-1px); box-shadow: 0 16px 38px -12px rgba(233, 162, 104, 0.7); }

    .ghost {
      border: 1px solid rgba(237, 232, 223, 0.16);
      color: var(--bone);
    }
    .ghost:hover { border-color: rgba(233, 162, 104, 0.45); color: #f4c79b; }

    .code {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--hairline);
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      color: #5d636b;
    }
  </style>
</head>
<body>
  <div class="grid-lines" aria-hidden="true"></div>

  <main>
    <span class="eyebrow">Error 404</span>
    <h1>Nothing lives at <em>this address</em>.</h1>
    <p>
      The page may have moved, been renamed, or never existed in the first place.
      The identity, however, is still online.
    </p>

    <div class="actions">
      <a class="primary" href="/Mr-Nobody-Anonymous/">
        Back to the portfolio
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8" />
        </svg>
      </a>
      <a class="ghost" href="https://github.com/Mr-Nobody-Anonymous" target="_blank" rel="noreferrer">GitHub</a>
    </div>

    <p class="code">ERR_TARGET_NOT_FOUND · ROUTE_NOT_RESOLVED</p>
  </main>
</body>
</html>
