<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-labelledby="t d">
  <title id="t">Beamlak Sintayehu — Cybersecurity, Offensive Security, Applied AI</title>
  <desc id="d">Obsidian banner with an ember wave, name and discipline line.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080a"/>
      <stop offset="0.55" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#12161c"/>
    </linearGradient>

    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9a268" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#e9a268" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#c98b7f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9fd8e4" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd8e4" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#9fd8e4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9a268" stop-opacity="0.30"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.82" cy="0.75" r="0.62">
      <stop offset="0" stop-color="#e9a268" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#e9a268" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ede8df" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1600" height="420"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1600" height="420" fill="url(#bg)"/>
    <rect width="1600" height="420" fill="url(#grid)"/>
    <rect width="1600" height="420" fill="url(#glow)"/>

    <!-- Two slow waves. calcMode is correct, paths are filled, colours render. -->
    <g opacity="0.85">
      <path fill="url(#waveA)" d="M0 372 Q 400 340 800 366 T 1600 350 L1600 420 L0 420 Z">
        <animate attributeName="d" dur="18s" repeatCount="indefinite" calcMode="spline"
                 keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                 values="M0 372 Q 400 340 800 366 T 1600 350 L1600 420 L0 420 Z;
                         M0 380 Q 400 402 800 372 T 1600 382 L1600 420 L0 420 Z;
                         M0 372 Q 400 340 800 366 T 1600 350 L1600 420 L0 420 Z"/>
      </path>
      <path fill="url(#waveB)" d="M0 398 Q 420 372 840 394 T 1600 384 L1600 420 L0 420 Z">
        <animate attributeName="d" dur="24s" repeatCount="indefinite" calcMode="spline"
                 keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                 values="M0 398 Q 420 372 840 394 T 1600 384 L1600 420 L0 420 Z;
                         M0 392 Q 420 410 840 386 T 1600 398 L1600 420 L0 420 Z;
                         M0 398 Q 420 372 840 394 T 1600 384 L1600 420 L0 420 Z"/>
      </path>
    </g>

    <!-- Hairlines -->
    <rect x="0" y="0" width="1600" height="1" fill="#e9a268" fill-opacity="0.20"/>
    <rect x="0" y="419" width="1600" height="1" fill="#e9a268" fill-opacity="0.28"/>

    <!-- Handle -->
    <text x="1532" y="64" text-anchor="end" fill="#7a8088" font-size="19" letter-spacing="2.4"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@Mr-Nobody-Anonymous</text>
    <circle cx="68" cy="58" r="5" fill="#e9a268"/>
    <circle cx="68" cy="58" r="5" fill="none" stroke="#e9a268" stroke-opacity="0.45" stroke-width="2">
      <animate attributeName="r" values="5;13;5" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Title -->
    <text x="66" y="176" fill="#ede8df" font-size="68" font-weight="600" letter-spacing="-1"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Beamlak Sintayehu</text>

    <!-- Subtitle -->
    <text x="68" y="226" fill="#e9a268" font-size="27" font-weight="500" letter-spacing="0.4"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Cybersecurity · Offensive Security · Applied AI</text>

    <!-- Rule -->
    <rect x="68" y="258" width="132" height="3" rx="1.5" fill="#e9a268" fill-opacity="0.75"/>

    <!-- Mono caption -->
    <text x="68" y="310" fill="#9fd8e4" font-size="20" letter-spacing="0.6"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&#62; building secure systems, and studying how they break.</text>
  </g>
</svg>
