name: hero-probe
on:
  push:
    paths:
      - '.github/workflows/hero-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect served banner
        run: |
          i=0
          for u in \
            "https://raw.githubusercontent.com/Mr-Nobody-Anonymous/Mr-Nobody-Anonymous/arena/e36eea0a-mr-nobody-anonymous/assets/profile-banner.svg" \
            "https://github.com/Mr-Nobody-Anonymous/Mr-Nobody-Anonymous/raw/arena/e36eea0a-mr-nobody-anonymous/assets/profile-banner.svg" ; do
            i=$((i+1))
            meta=$(curl -sL -m 30 -o /tmp/b.svg -w "%{http_code} %{content_type} %{size_download}" "$u")
            echo "::error title=$i::$meta ::$u"
          done
          python3 -c "import xml.dom.minidom as m; m.parse('/tmp/b.svg'); print('XML OK')" || echo "::error title=xml::invalid svg"
