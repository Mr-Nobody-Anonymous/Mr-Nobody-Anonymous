name: zz-close
on:
  push:
    paths:
      - '.github/workflows/zz-close.yml'
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}/issues/7" -f state=closed -f state_reason=completed --jq '.state'
