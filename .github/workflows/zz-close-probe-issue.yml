name: zz-close-probe-issue
on:
  push:
    paths:
      - '.github/workflows/zz-close-probe-issue.yml'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close temporary probe issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}/issues/5" -f state=closed -f state_reason=completed --jq '.state'
