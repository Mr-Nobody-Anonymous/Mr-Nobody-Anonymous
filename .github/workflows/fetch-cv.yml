name: fetch-cv
on:
  push:
    paths:
      - '.github/workflows/fetch-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/8812aaf8-mr-nobody-anonymous
      - name: Download CV from Drive and commit
        run: |
          set -e
          ID=1QOfKHVMVt6xYPyRsn4AV9X1l4RtUz-S7
          curl -sL -c /tmp/cj -o /tmp/a.html "https://drive.google.com/uc?export=download&id=$ID"
          file -b /tmp/a.html
          # large-file confirm token flow
          TOKEN=$(grep -o 'confirm=[A-Za-z0-9_-]*' /tmp/a.html | head -1 | cut -d= -f2 || true)
          echo "token='${TOKEN}'"
          if [ -n "$TOKEN" ]; then
            curl -sL -b /tmp/cj -o /tmp/cv.pdf "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=$TOKEN"
          else
            curl -sL -b /tmp/cj -o /tmp/cv.pdf "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"
          fi
          file -b /tmp/cv.pdf
          ls -l /tmp/cv.pdf
          head -c 5 /tmp/cv.pdf; echo
          cp /tmp/cv.pdf my_portfolio/public/cv.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_portfolio/public/cv.pdf
          git commit -m "assets: real CV from Drive"
          git push origin HEAD:arena/8812aaf8-mr-nobody-anonymous
