name: widget-probe
on:
  push:
    paths:
      - '.github/workflows/widget-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe final widget URLs
        run: |
          probe () {
            code=$(curl -sL -m 30 -A "Mozilla/5.0 (compatible; probe)" -o /tmp/body -w "%{http_code}" "$1" || echo "ERR")
            size=$(wc -c < /tmp/body | tr -d ' ')
            printf '%-4s %-8s %s\n' "$code" "$size" "$1"
            printf '     HEAD>>> %s\n' "$(tr -d '\n' < /tmp/body | sed 's/  */ /g' | cut -c1-700)"
          }
          {
          while IFS= read -r u; do [ -n "$u" ] && probe "$u"; done <<'URLS'
          https://ghchart.rshah.org/e9a268/Mr-Nobody-Anonymous
          https://trophy.ryglcloud.net/?username=Mr-Nobody-Anonymous&theme=onedark&no-frame=true&no-bg=true&column=7&row=1&margin-w=8&margin-h=8
          https://img.shields.io/github/followers/Mr-Nobody-Anonymous?label=Followers&style=flat-square&color=e9a268&labelColor=0e1116&cacheSeconds=86400
          https://img.shields.io/github/stars/Mr-Nobody-Anonymous?label=Total%20stars&affiliations=OWNER&style=flat-square&color=e9a268&labelColor=0e1116&cacheSeconds=86400
          https://github-readme-stats.vercel.app/api?username=Mr-Nobody-Anonymous&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&rank_icon=github&cache_seconds=86400&bg_color=0e1116&title_color=e9a268&text_color=ede8df&icon_color=e9a268
          https://github-readme-stats.vercel.app/api?username=Mr-Nobody-Anonymous&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&rank_icon=github&bg_color=0e1116&title_color=e9a268&text_color=ede8df&icon_color=e9a268
          https://github-readme-stats.vercel.app/api/top-langs/?username=Mr-Nobody-Anonymous&layout=compact&langs_count=10&hide_border=true&bg_color=0e1116&title_color=e9a268&text_color=ede8df
          https://github-readme-stats.vercel.app/api/top-langs/?username=Mr-Nobody-Anonymous&layout=compact&langs_count=10&hide_border=true&cache_seconds=86400&bg_color=0e1116&title_color=e9a268&text_color=ede8df
          https://streak-stats.demolab.com?user=Mr-Nobody-Anonymous&hide_border=true&background=0e1116&border=1b1f25&stroke=e9a268&ring=e9a268&fire=e9a268&currStreakNum=ede8df&sideNums=ede8df&currStreakLabel=e9a268&sideLabels=8a8f96&dates=8a8f96
          https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=Mr-Nobody-Anonymous&theme=github_dark
          https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=Mr-Nobody-Anonymous&theme=github_dark&utcOffset=3
          https://img.shields.io/badge/dynamic/json?url=https%3A%2F%2Fapi.github.com%2Fusers%2FMr-Nobody-Anonymous&query=public_repos&label=Public%20repos&style=flat-square&color=e9a268&labelColor=0e1116&cacheSeconds=3600
          https://img.shields.io/badge/CV-Download%20PDF-0e1116?style=flat-square&labelColor=0e1116&logo=adobeacrobatreader&logoColor=e9a268
          https://mr-nobody-anonymous.github.io/Mr-Nobody-Anonymous/cv.pdf
          URLS
          } | tee probe-results.txt

      - name: Publish results as issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues/5/comments" \
            --field body="$(cat probe-results.txt)" --jq .html_url
