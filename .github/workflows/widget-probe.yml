name: widget-probe
on:
  push:
    paths:
      - '.github/workflows/widget-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe image endpoints
        run: |
          probe () {
            code=$(curl -sL -m 25 -A "Mozilla/5.0 (compatible; probe)" -o /tmp/body -w "%{http_code}" "$1" || echo "ERR")
            ct=$(file -b --mime-type /tmp/body 2>/dev/null || echo "?")
            size=$(wc -c < /tmp/body | tr -d ' ')
            printf '%-4s %-16s %-8s %s\n' "$code" "$ct" "$size" "$1"
            case "$ct" in
              text/html) printf '     HEAD>>> %s\n' "$(tr -d '\n' < /tmp/body | sed 's/  */ /g' | cut -c1-260)" ;;
            esac
          }
          for u in \
            "https://trophy.ryglcloud.net/?username=Mr-Nobody-Anonymous&theme=onedark&column=-1&margin-w=8" \
            "https://github-trophies.vercel.app/?username=Mr-Nobody-Anonymous&theme=onedark&column=-1&margin-w=8" \
            "https://gh-trophy.vercel.app/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://github-readme-activity-graph.luckylinux.dev/graph?username=Mr-Nobody-Anonymous&theme=github-compact" \
            "https://ghchart.rshah.org/e9a268/Mr-Nobody-Anonymous" \
            "https://github-readme-stats.vercel.app/api?username=Mr-Nobody-Anonymous&show_icons=true" \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=Mr-Nobody-Anonymous" \
            "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=Mr-Nobody-Anonymous" \
            "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=Mr-Nobody-Anonymous" \
            "https://github-readme-streak-stats.herokuapp.com?user=Mr-Nobody-Anonymous" \
            "https://streak-stats.demolab.com?user=Mr-Nobody-Anonymous&theme=transparent" ; do
            probe "$u"
          done | tee probe-results.txt

      - name: Publish results as issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues/5/comments" \
            --field body="$(cat probe-results.txt)" --jq .html_url
