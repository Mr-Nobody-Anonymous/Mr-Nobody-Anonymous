name: widget-probe
on:
  push:
    paths:
      - '.github/workflows/widget-probe.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe image endpoints
        run: |
          probe () {
            code=$(curl -sL -m 25 -A "Mozilla/5.0 (compatible; probe)" -o /tmp/body -w "%{http_code}" "$1" || echo "ERR")
            ct=$(file -b --mime-type /tmp/body 2>/dev/null || echo "?")
            size=$(wc -c < /tmp/body | tr -d ' ')
            printf '%-4s %-16s %-8s %s\n' "$code" "$ct" "$size" "$1"
          }
          for u in \
            "https://github-profile-trophy.vercel.app/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://trophy.ryglcloud.net/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://gh-trophy.cdnsoft.net/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://trophygh.kolioaris.xyz/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://github-trophies.vercel.app/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://github-profile-trophy-orcin-eta.vercel.app/?username=Mr-Nobody-Anonymous&theme=onedark" \
            "https://github-readme-activity-graph.vercel.app/graph?username=Mr-Nobody-Anonymous" \
            "https://github-activity-graph.luckylinux.dev/graph?username=Mr-Nobody-Anonymous" \
            "https://ghchart.rshah.org/e9a268/Mr-Nobody-Anonymous" \
            "https://github-readme-stats.vercel.app/api?username=Mr-Nobody-Anonymous" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Mr-Nobody-Anonymous" \
            "https://github-stats-extended.vercel.app/api?username=Mr-Nobody-Anonymous" \
            "https://streak-stats.demolab.com?user=Mr-Nobody-Anonymous" \
            "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=Mr-Nobody-Anonymous" \
            "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=Mr-Nobody-Anonymous" \
            "https://img.shields.io/github/followers/Mr-Nobody-Anonymous" \
            "https://img.shields.io/github/stars/Mr-Nobody-Anonymous?affiliations=OWNER" \
            "https://komarev.com/ghpvc/?username=Mr-Nobody-Anonymous" \
            "https://capsule-render.vercel.app/api?type=waving&text=test" \
            "https://readme-typing-svg.demolab.com?lines=test" \
            "https://skillicons.dev/icons?i=py" \
            "https://www.linkedin.com/in/beamlak-sintayehu-a47b4b281/" \
            "https://www.linkedin.com/in/bam-sintu-a47b4b281/" \
            "https://drive.google.com/drive/folders/1NrrdRGhOOkOCJf_iOr-VSZl9qkzRBmnd" ; do
            probe "$u"
          done | tee probe-results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe-results.txt
